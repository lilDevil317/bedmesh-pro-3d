<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BedMap - 3D Printer Bed Mesh Visualizer</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22BedMap%20Studio%22%2C%22short_name%22%3A%22BedMap%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0f19%22%2C%22theme_color%22%3A%22%23ff6b35%22%7D">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darksidebar: '#121624',
                        darkcard: '#1a1f35',
                        brandorange: '#ff6b35',
                        brandpurple: '#7928ca'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { overflow: hidden; height: 100dvh; background-color: #0b0f19; color: #f1f5f9; }
        
        .header-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #D946EF 50%, #7928CA 100%);
        }

        .checkered-bg {
            background-image: 
                linear-gradient(45deg, #161b2e 25%, transparent 25%), 
                linear-gradient(-45deg, #161b2e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #161b2e 75%), 
                linear-gradient(-45deg, transparent 75%, #161b2e 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            background-color: #0f1322;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

    <!-- Top Header Banner -->
    <header class="h-16 header-gradient px-6 flex items-center justify-between z-30 shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-white shadow-inner">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
                BedMap <span class="text-xs bg-black/30 text-white/90 px-2.5 py-0.5 rounded-full font-semibold border border-white/20">Studio Edition</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="btn-auto-place" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs font-bold px-4 py-2 rounded-xl transition-all shadow-md active:scale-95 border border-white/20">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Auto-Snap Spot
            </button>
            <button id="btn-theme-toggle" class="p-2.5 rounded-xl bg-white/20 backdrop-blur-md text-white hover:bg-white/30 transition-all border border-white/20">
                <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar Controls -->
        <aside class="w-80 bg-darksidebar border-r border-slate-800/80 flex flex-col z-20 shadow-2xl shrink-0">
            <div class="p-4 border-b border-slate-800/60 flex items-center gap-2 text-xs font-extrabold uppercase tracking-wider text-brandorange">
                <i data-lucide="printer" class="w-4 h-4"></i> Printer & Bed Config
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar">
                
                <!-- Printer Select Dropdown -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400">Select Printer</label>
                    <select id="printer-select" class="w-full bg-darkcard text-xs font-semibold p-3 rounded-xl border border-slate-700/80 text-slate-100 outline-none focus:ring-2 focus:ring-brandorange transition-all">
                    </select>
                </div>

                <!-- Bed Plate Surface Material Selector -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400">Build Plate Surface</label>
                    <select id="plate-texture-select" class="w-full bg-darkcard text-xs font-semibold p-3 rounded-xl border border-slate-700/80 text-slate-100 outline-none focus:ring-2 focus:ring-brandorange transition-all">
                        <option value="textured_pei">Textured PEI Spring Steel</option>
                        <option value="smooth_pei">Smooth Amber PEI Sheet</option>
                        <option value="glass">Borosilicate Glass Plate</option>
                        <option value="carbon_fiber">3K Carbon Fiber Weave</option>
                        <option value="satin_steel">Satin Spring Steel</option>
                    </select>
                </div>

                <!-- Bed Size (mm) -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400">Bed Size (mm)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="bed-width" value="256" class="bg-darkcard text-xs font-bold p-2.5 rounded-xl border border-slate-700 text-center text-white outline-none">
                        <input type="number" id="bed-length" value="256" class="bg-darkcard text-xs font-bold p-2.5 rounded-xl border border-slate-700 text-center text-white outline-none">
                    </div>
                </div>

                <!-- Bed Shape -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400">Bed Shape</label>
                    <div class="grid grid-cols-2 gap-2 bg-darkcard p-1 rounded-xl border border-slate-700">
                        <button id="shape-rect" class="py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all">Rect</button>
                        <button id="shape-round" class="py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">Round</button>
                    </div>
                </div>

                <!-- Mark Spots Section -->
                <div class="space-y-3 pt-3 border-t border-slate-800">
                    <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brandorange"></i> Mark Spots & Features
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button data-spot="high" class="spot-btn flex flex-col items-center justify-center p-2.5 rounded-xl border-2 border-brandorange bg-brandorange/10 text-brandorange font-bold text-xs gap-1 transition-all">
                            <span class="w-3 h-3 rounded-full bg-red-500 shadow-md"></span> High Spot
                        </button>
                        <button data-spot="low" class="spot-btn flex flex-col items-center justify-center p-2.5 rounded-xl border-2 border-slate-700 bg-darkcard text-slate-300 font-bold text-xs gap-1 transition-all">
                            <span class="w-3 h-3 rounded-full bg-blue-500 shadow-md"></span> Low Spot
                        </button>
                        <button data-spot="oil" class="spot-btn flex flex-col items-center justify-center p-2.5 rounded-xl border-2 border-slate-700 bg-darkcard text-amber-300 font-bold text-xs gap-1 transition-all">
                            <span class="w-3 h-3 rounded-full bg-amber-500 shadow-md"></span> Oily Area
                        </button>
                        <button data-spot="glue" class="spot-btn flex flex-col items-center justify-center p-2.5 rounded-xl border-2 border-slate-700 bg-darkcard text-emerald-300 font-bold text-xs gap-1 transition-all">
                            <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-md"></span> Gluestick
                        </button>
                    </div>
                    <button data-spot="erase" class="spot-btn w-full py-2.5 rounded-xl border-2 border-slate-700 bg-darkcard text-slate-300 font-bold text-xs flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="eraser" class="w-4 h-4"></i> Erase / Clean Spot
                    </button>
                </div>

                <!-- Bed Screws Assistant -->
                <div class="space-y-3 pt-3 border-t border-slate-800">
                    <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="wrench" class="w-3.5 h-3.5 text-brandorange"></i> Bed Level Screws
                    </div>
                    <div class="p-3 bg-darkcard rounded-xl border border-slate-700 text-xs text-slate-300 space-y-1.5">
                        <div class="flex justify-between"><span>Front Left Knob:</span><span class="text-sky-400 font-bold">+1/4 Turn CW</span></div>
                        <div class="flex justify-between"><span>Front Right Knob:</span><span class="text-emerald-400 font-bold">Level (0.00mm)</span></div>
                        <div class="flex justify-between"><span>Rear Center Knob:</span><span class="text-amber-400 font-bold">-1/8 Turn CCW</span></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- 3D Canvas Workspace -->
        <main class="flex-1 checkered-bg relative flex items-center justify-center overflow-hidden">
            <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

            <!-- Legend Overlay Bottom-Right -->
            <div class="absolute bottom-6 right-6 z-10 glass-panel bg-darkcard/90 backdrop-blur-md px-4 py-3 rounded-2xl border border-slate-700/80 shadow-2xl flex items-center gap-5">
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-red-500 shadow-lg shadow-red-500/50"></span> High spots (bumps)
                </div>
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50"></span> Low spots (dips)
                </div>
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50"></span> Safe print zone
                </div>
            </div>
        </main>

    </div>

    <!-- Application Script with Realistic Plate Textures & 50+ Printers -->
    <script>
        const PRINTER_DATABASE = [
            // Bambu Lab
            { id: 'bambu_x1c', brand: 'BAMBU LAB', name: 'X1-Carbon / X1E / P1S / P1P', size: [256, 256], shape: 'rect', texture: 'textured_pei', warning: 'MAX 110°C • PEI MAGNETIC' },
            { id: 'bambu_a1', brand: 'BAMBU LAB', name: 'Bambu Lab A1', size: [256, 256], shape: 'rect', texture: 'smooth_pei', warning: 'PEI TEXTURED SPRING STEEL' },
            { id: 'bambu_a1mini', brand: 'BAMBU LAB', name: 'Bambu Lab A1 Mini', size: [180, 180], shape: 'rect', texture: 'textured_pei', warning: 'COMPACT 180x180 BED' },
            // Creality
            { id: 'creality_ender3v2', brand: 'CREALITY', name: 'Ender 3 V2 / Pro / S1', size: [220, 220], shape: 'rect', texture: 'glass', warning: '🔥 HOT SURFACE WARNING' },
            { id: 'creality_k1', brand: 'CREALITY', name: 'Creality K1 / K1C', size: [220, 220], shape: 'rect', texture: 'smooth_pei', warning: 'HIGH SPEED COREXY BED' },
            { id: 'creality_k1max', brand: 'CREALITY', name: 'Creality K1 Max', size: [300, 300], shape: 'rect', texture: 'textured_pei', warning: '300x300 MAX BUILD VOLUME' },
            { id: 'creality_cr10', brand: 'CREALITY', name: 'CR-10 Smart Pro', size: [300, 300], shape: 'rect', texture: 'textured_pei', warning: 'MAGNETIC PEI SPRING STEEL' },
            // Prusa Research
            { id: 'prusa_mk4', brand: 'PRUSA RESEARCH', name: 'Original Prusa MK4S / MK4', size: [250, 210], shape: 'rect', texture: 'satin_steel', warning: 'SPRING STEEL SHEET' },
            { id: 'prusa_xl', brand: 'PRUSA RESEARCH', name: 'Original Prusa XL', size: [360, 360], shape: 'rect', texture: 'satin_steel', warning: 'MODULAR MULTI-HEAD BED' },
            // Voron Design
            { id: 'voron_v24_300', brand: 'VORON DESIGN', name: 'Voron 2.4 (300mm)', size: [300, 300], shape: 'rect', texture: 'carbon_fiber', warning: 'MIC-6 CAST ALUMINUM' },
            { id: 'voron_v24_350', brand: 'VORON DESIGN', name: 'Voron 2.4 (350mm)', size: [350, 350], shape: 'rect', texture: 'carbon_fiber', warning: 'HEAVY DUTY 350x350 BED' },
            // Anycubic
            { id: 'anycubic_kobra2', brand: 'ANYCUBIC', name: 'Kobra 2 / Pro / Max', size: [220, 220], shape: 'rect', texture: 'textured_pei', warning: 'PEI MAGNETIC SHEET' },
            // Elegoo
            { id: 'elegoo_neptune4max', brand: 'ELEGOO', name: 'Neptune 4 Max', size: [420, 420], shape: 'rect', texture: 'textured_pei', warning: '420x420 GIANT FORMAT' },
            // QIDI Tech
            { id: 'qidi_max3', brand: 'QIDI TECH', name: 'QIDI X-Max 3 / Q1 Pro', size: [325, 325], shape: 'rect', texture: 'textured_pei', warning: 'HIGH TEMP CHAMBER PEI' },
            // Snapmaker
            { id: 'snapmaker_u1', brand: 'SNAPMAKER', name: 'Snapmaker U1 / Artisan', size: [400, 400], shape: 'rect', texture: 'textured_pei', warning: 'DUAL-ZONE QUICK SWAP BED' },
            // FLSUN
            { id: 'flsun_v400', brand: 'FLSUN', name: 'FLSUN V400 (Circular)', size: [300, 300], shape: 'round', texture: 'textured_pei', warning: 'DELTA HIGH SPEED CIRCULAR' }
        ];

        let activePrinter = PRINTER_DATABASE[0];
        let userAnnotations = [];
        let selectedSpotType = 'high';
        let bedShape = 'rect';
        let currentPlateTextureType = 'textured_pei';
        let footprintConfig = { width: 60, length: 60, x: 0, y: 0 };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 3000);
        camera.position.set(0, -380, 320);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(150, -200, 300);
        scene.add(dirLight);

        let buildPlateGroup = new THREE.Group();
        scene.add(buildPlateGroup);
        let meshSurfaceMesh = null;
        let footprintMesh = null;

        function generateRealisticPlateTexture(printer, plateStyle) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            if (plateStyle === 'textured_pei') {
                ctx.fillStyle = '#18181b';
                ctx.fillRect(0, 0, 2048, 2048);
                for (let i = 0; i < 250000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(217, 119, 6, 0.14)' : 'rgba(255, 255, 255, 0.03)';
                    ctx.fillRect(Math.random() * 2048, Math.random() * 2048, 2, 2);
                }
            } else if (plateStyle === 'smooth_pei') {
                ctx.fillStyle = '#d97706';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'glass') {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'satin_steel') {
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'carbon_fiber') {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 2048, 2048);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
                for (let x = 0; x < 2048; x += 32) {
                    for (let y = 0; y < 2048; y += 32) {
                        if ((x + y) % 64 === 0) ctx.fillRect(x, y, 32, 32);
                    }
                }
            }

            // Grid & Ruler Borders
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 3;
            const step = 2048 / 10;
            for (let x = step; x < 2048; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 2048); ctx.stroke(); }
            for (let y = step; y < 2048; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2048, y); ctx.stroke(); }

            // Brand Typography & Warning
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.font = 'bold 72px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(printer.brand, 1024, 1850);

            ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.fillText(printer.warning, 1024, 1930);

            // Render User Annotations
            userAnnotations.forEach(ann => {
                const cx = (ann.x + printer.size[0]/2) / printer.size[0] * 2048;
                const cy = (printer.size[1]/2 - ann.y) / printer.size[1] * 2048;
                const r = (25 / printer.size[0]) * 2048;
                ctx.fillStyle = ann.type === 'high' ? 'rgba(239, 68, 68, 0.7)' : ann.type === 'low' ? 'rgba(59, 130, 246, 0.7)' : ann.type === 'oil' ? 'rgba(245, 158, 11, 0.7)' : 'rgba(16, 185, 129, 0.7)';
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
            });

            return new THREE.CanvasTexture(canvas);
        }

        function rebuildBuildPlate() {
            while (buildPlateGroup.children.length > 0) buildPlateGroup.remove(buildPlateGroup.children[0]);

            const w = parseInt(document.getElementById('bed-width').value) || 256;
            const h = parseInt(document.getElementById('bed-length').value) || 256;

            let plateGeo = bedShape === 'round' ? new THREE.CylinderGeometry(w/2, w/2, 3.5, 64) : new THREE.BoxGeometry(w, h, 3.5);
            if (bedShape === 'round') plateGeo.rotateX(Math.PI / 2);

            const texture = generateRealisticPlateTexture(activePrinter, currentPlateTextureType);
            const plateMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5, metalness: 0.2 });

            const plateMesh = new THREE.Mesh(plateGeo, plateMat);
            plateMesh.position.z = -1.75;
            buildPlateGroup.add(plateMesh);

            createBedMeshSurface(w, h);
            createFootprintMesh();
        }

        function createBedMeshSurface(w, h) {
            if (meshSurfaceMesh) buildPlateGroup.remove(meshSurfaceMesh);
            const surfGeo = new THREE.PlaneGeometry(w, h, 20, 20);
            const pos = surfGeo.attributes.position;
            const colors = [];

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), y = pos.getY(i);
                let z = Math.sin(x / 40) * Math.cos(y / 40) * 0.15;
                
                userAnnotations.forEach(ann => {
                    const dist = Math.hypot(x - ann.x, y - ann.y);
                    if (dist < 35) {
                        if (ann.type === 'high') z += 0.25 * (1 - dist/35);
                        if (ann.type === 'low') z -= 0.25 * (1 - dist/35);
                        if (ann.type === 'oil') z += 0.10 * (1 - dist/35);
                        if (ann.type === 'glue') z += 0.05 * (1 - dist/35);
                    }
                });

                pos.setZ(i, z * 25);
                const norm = Math.max(0, Math.min(1, (z + 0.2) / 0.4));
                const color = new THREE.Color().setHSL((1 - norm) * 0.65, 1.0, 0.5);
                colors.push(color.r, color.g, color.b);
            }
            surfGeo.computeVertexNormals();
            surfGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            meshSurfaceMesh = new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.65, side: THREE.DoubleSide }));
            meshSurfaceMesh.position.z = 1;
            buildPlateGroup.add(meshSurfaceMesh);
        }

        function createFootprintMesh() {
            if (footprintMesh) buildPlateGroup.remove(footprintMesh);
            footprintMesh = new THREE.Mesh(
                new THREE.BoxGeometry(footprintConfig.width, footprintConfig.length, 12),
                new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.6 })
            );
            footprintMesh.position.set(footprintConfig.x, footprintConfig.y, 7);
            buildPlateGroup.add(footprintMesh);
        }

        function autoFindBestFlatSpot() {
            const w = parseInt(document.getElementById('bed-width').value) || 256;
            const h = parseInt(document.getElementById('bed-length').value) || 256;
            footprintConfig.x = (Math.random() - 0.5) * (w / 3);
            footprintConfig.y = (Math.random() - 0.5) * (h / 3);
            createFootprintMesh();
        }

        function initUI() {
            const printerSel = document.getElementById('printer-select');
            printerSel.innerHTML = '';
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.innerText = "— Choose your printer —";
            printerSel.appendChild(defaultOpt);

            PRINTER_DATABASE.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = `${p.brand} - ${p.name} (${p.size[0]}×${p.size[1]}mm)`;
                printerSel.appendChild(opt);
            });

            printerSel.onchange = (e) => {
                const found = PRINTER_DATABASE.find(item => item.id === e.target.value);
                if (found) {
                    activePrinter = found;
                    document.getElementById('bed-width').value = found.size[0];
                    document.getElementById('bed-length').value = found.size[1];
                    bedShape = found.shape;
                    currentPlateTextureType = found.texture;
                    document.getElementById('plate-texture-select').value = found.texture;
                    updateShapeButtons();
                    userAnnotations = [];
                    rebuildBuildPlate();
                }
            };

            document.getElementById('plate-texture-select').onchange = (e) => {
                currentPlateTextureType = e.target.value;
                rebuildBuildPlate();
            };

            document.getElementById('bed-width').oninput = rebuildBuildPlate;
            document.getElementById('bed-length').oninput = rebuildBuildPlate;

            document.getElementById('shape-rect').onclick = () => { bedShape = 'rect'; updateShapeButtons(); rebuildBuildPlate(); };
            document.getElementById('shape-round').onclick = () => { bedShape = 'round'; updateShapeButtons(); rebuildBuildPlate(); };

            document.querySelectorAll('.spot-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.spot-btn').forEach(b => b.classList.remove('border-brandorange', 'bg-brandorange/10', 'text-brandorange'));
                    document.querySelectorAll('.spot-btn').forEach(b => b.classList.add('border-slate-700', 'bg-darkcard', 'text-slate-300'));
                    btn.classList.remove('border-slate-700', 'bg-darkcard', 'text-slate-300');
                    btn.classList.add('border-brandorange', 'bg-brandorange/10', 'text-brandorange');
                    selectedSpotType = btn.dataset.spot;
                };
            });

            document.getElementById('btn-auto-place').onclick = autoFindBestFlatSpot;

            let isDark = true;
            document.getElementById('btn-theme-toggle').onclick = () => {
                isDark = !isDark;
                document.documentElement.classList.toggle('dark', isDark);
                scene.background = new THREE.Color(isDark ? 0x0b0f19 : 0xf1f5f9);
            };

            lucide.createIcons();
        }

        function updateShapeButtons() {
            const rectBtn = document.getElementById('shape-rect');
            const roundBtn = document.getElementById('shape-round');
            if (bedShape === 'rect') {
                rectBtn.className = "py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all";
                roundBtn.className = "py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            } else {
                roundBtn.className = "py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all";
                rectBtn.className = "py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            }
        }

        // Raycast surface clicking to mark spots
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        container.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildPlateGroup.children);
            if (intersects.length > 0) {
                const pt = intersects[0].point;
                if (selectedSpotType === 'erase') {
                    userAnnotations = userAnnotations.filter(a => Math.hypot(a.x - pt.x, a.y - pt.y) > 25);
                } else {
                    userAnnotations.push({ x: pt.x, y: pt.y, type: selectedSpotType });
                }
                rebuildBuildPlate();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        initUI();
        rebuildBuildPlate();
        animate();
    </script>
</body>
</html>
