<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BedMap - 3D Printer Bed Mesh Visualizer Studio Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darksidebar: '#121624',
                        darkcard: '#1a1f35',
                        brandorange: '#ff6b35',
                        brandpurple: '#7928ca'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { overflow: hidden; height: 100dvh; background-color: #0b0f19; color: #f1f5f9; }
        
        .header-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #D946EF 50%, #7928CA 100%);
        }

        .checkered-bg {
            background-image: 
                linear-gradient(45deg, #161b2e 25%, transparent 25%), 
                linear-gradient(-45deg, #161b2e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #161b2e 75%), 
                linear-gradient(-45deg, transparent 75%, #161b2e 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            background-color: #0f1322;
            transition: background-color 0.3s ease;
        }

        .light .checkered-bg {
            background-image: 
                linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-color: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

    <!-- Top Header Banner -->
    <header class="h-16 header-gradient px-6 flex items-center justify-between z-30 shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-white shadow-inner">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </div>
            <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">
                BedMap <span class="text-xs bg-black/30 text-white/90 px-2.5 py-0.5 rounded-full font-semibold border border-white/20">Studio Edition</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="btn-theme-toggle" class="p-2.5 rounded-xl bg-white/20 backdrop-blur-md text-white hover:bg-white/30 transition-all border border-white/20 shadow-md">
                <i data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Sidebar Controls -->
        <aside class="w-80 bg-darksidebar border-r border-slate-800/80 flex flex-col z-20 shadow-2xl shrink-0">
            <div class="p-4 border-b border-slate-800/60 flex items-center gap-2 text-xs font-extrabold uppercase tracking-wider text-brandorange">
                <i data-lucide="printer" class="w-4 h-4"></i> Printer
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                
                <!-- Printer Select Dropdown -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-400">Select Printer</label>
                    <select id="printer-select" class="w-full bg-darkcard text-xs font-semibold p-3 rounded-xl border border-slate-700/80 text-slate-100 outline-none focus:ring-2 focus:ring-brandorange transition-all">
                    </select>
                </div>

                <!-- Bed Image Upload / Rendered Toggle -->
                <div class="space-y-2">
                    <button id="btn-upload-trigger" class="w-full py-3 header-gradient text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-md shadow-brandorange/25 active:scale-95 transition-all">
                        <i data-lucide="upload" class="w-4 h-4"></i> Upload Bed Image
                    </button>
                    <input type="file" id="bed-image-input" accept="image/*" class="hidden">
                    <button id="btn-rendered-plate" class="w-full py-2.5 bg-darkcard hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-bold border border-slate-700 transition-all">
                        Use Rendered Bed Plate
                    </button>
                </div>

                <!-- Build Plate Surface Material -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-400">Build Plate Surface</label>
                    <select id="plate-texture-select" class="w-full bg-darkcard text-xs font-semibold p-2.5 rounded-xl border border-slate-700/80 text-slate-100 outline-none focus:ring-2 focus:ring-brandorange transition-all">
                        <option value="textured_pei">Textured PEI Spring Steel</option>
                        <option value="smooth_pei">Smooth Amber PEI Sheet</option>
                        <option value="glass">Borosilicate Glass Plate</option>
                        <option value="carbon_fiber">3K Carbon Fiber Weave</option>
                        <option value="satin_steel">Satin Spring Steel</option>
                    </select>
                </div>

                <!-- Bed Size (mm) -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-400">Bed Size (mm)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="bed-width" value="256" class="bg-darkcard text-xs font-bold p-2.5 rounded-xl border border-slate-700 text-center text-white outline-none">
                        <input type="number" id="bed-length" value="256" class="bg-darkcard text-xs font-bold p-2.5 rounded-xl border border-slate-700 text-center text-white outline-none">
                    </div>
                </div>

                <!-- Bed Shape -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-400">Bed Shape</label>
                    <div class="grid grid-cols-2 gap-2 bg-darkcard p-1 rounded-xl border border-slate-700">
                        <button id="shape-rect" class="py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all">Rect</button>
                        <button id="shape-round" class="py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">Round</button>
                    </div>
                </div>

                <!-- Toggles -->
                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="toggle-grid" checked class="w-4 h-4 rounded bg-darkcard border-slate-700 accent-brandorange">
                        <span class="text-xs font-semibold text-slate-300">Show grid</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="toggle-safe" checked class="w-4 h-4 rounded bg-darkcard border-slate-700 accent-brandorange">
                        <span class="text-xs font-semibold text-slate-300">Highlight safe zones</span>
                    </label>
                </div>

                <!-- Mark Spots Section -->
                <div class="space-y-2 pt-3 border-t border-slate-800">
                    <div class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brandorange"></i> Mark Spots
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button data-spot="high" class="spot-btn flex flex-col items-center justify-center p-2 rounded-xl border-2 border-brandorange bg-brandorange/10 text-brandorange font-bold text-xs gap-1 transition-all">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-md"></span> High
                        </button>
                        <button data-spot="low" class="spot-btn flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-700 bg-darkcard text-slate-300 font-bold text-xs gap-1 transition-all">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-md"></span> Low
                        </button>
                        <button data-spot="scratch" class="spot-btn flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-700 bg-darkcard text-amber-300 font-bold text-xs gap-1 transition-all">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-md"></span> Scratch
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-2">
                        <button data-spot="oil" class="spot-btn flex items-center justify-center gap-1.5 p-2 rounded-xl border-2 border-slate-700 bg-darkcard text-yellow-300 font-bold text-xs transition-all">
                            <span class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span> Oily Area
                        </button>
                        <button data-spot="erase" class="spot-btn flex items-center justify-center gap-1.5 p-2 rounded-xl border-2 border-slate-700 bg-darkcard text-slate-300 font-bold text-xs transition-all">
                            <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Erase Spot
                        </button>
                    </div>
                </div>

            </div>
        </aside>

        <!-- 3D Canvas Workspace matching reference layout -->
        <main class="flex-1 checkered-bg relative flex items-center justify-center overflow-hidden">
            <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

            <!-- Legend Overlay Bottom-Right matching reference -->
            <div class="absolute bottom-6 right-6 z-10 bg-darkcard/90 backdrop-blur-md px-4 py-3 rounded-2xl border border-slate-700/80 shadow-2xl flex items-center gap-5">
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-red-500 shadow-lg shadow-red-500/50"></span> High spots (bumps)[span_1](start_span)[span_1](end_span)
                </div>
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50"></span> Low spots (dips)[span_2](start_span)[span_2](end_span)
                </div>
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-300">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50"></span> Safe print zone[span_3](start_span)[span_3](end_span)
                </div>
            </div>
        </main>

    </div>

    <!-- Application Script -->
    <script>
        const PRINTER_DATABASE = [
            // Bambu Lab Submodels
            { id: 'bambu_x1c', brand: 'BAMBU LAB', name: 'X1-Carbon / X1E', size: [256, 256], shape: 'rect', texture: 'textured_pei', warning: 'MAX 110°C • PEI MAGNETIC' },
            { id: 'bambu_p1s', brand: 'BAMBU LAB', name: 'P1S / P1P', size: [256, 256], shape: 'rect', texture: 'textured_pei', warning: 'PEI SPRING STEEL PLATE' },
            { id: 'bambu_a1', brand: 'BAMBU LAB', name: 'Bambu Lab A1', size: [256, 256], shape: 'rect', texture: 'smooth_pei', warning: 'PEI TEXTURED SHEET' },
            { id: 'bambu_a1mini', brand: 'BAMBU LAB', name: 'Bambu Lab A1 Mini', size: [180, 180], shape: 'rect', texture: 'textured_pei', warning: 'COMPACT 180x180 BED' },
            
            // Creality Submodels
            { id: 'creality_ender3v2', brand: 'CREALITY', name: 'Ender 3 V2 / Pro', size: [220, 220], shape: 'rect', texture: 'glass', warning: '🔥 GLASS SURFACE' },
            { id: 'creality_ender3s1', brand: 'CREALITY', name: 'Ender 3 S1 / S1 Pro', size: [220, 220], shape: 'rect', texture: 'textured_pei', warning: 'PC SPRING STEEL' },
            { id: 'creality_k1', brand: 'CREALITY', name: 'Creality K1 / K1C', size: [220, 220], shape: 'rect', texture: 'smooth_pei', warning: 'HIGH SPEED COREXY' },
            { id: 'creality_k1max', brand: 'CREALITY', name: 'Creality K1 Max', size: [300, 300], shape: 'rect', texture: 'textured_pei', warning: '300x300 MAX VOLUME' },
            { id: 'creality_cr10smart', brand: 'CREALITY', name: 'CR-10 Smart Pro', size: [300, 300], shape: 'rect', texture: 'textured_pei', warning: 'PEI MAGNETIC SHEET' },

            // Prusa Research Submodels
            { id: 'prusa_mk4', brand: 'PRUSA RESEARCH', name: 'Original Prusa MK4S / MK4', size: [250, 210], shape: 'rect', texture: 'satin_steel', warning: 'SPRING STEEL SHEET' },
            { id: 'prusa_mk3s', brand: 'PRUSA RESEARCH', name: 'Original Prusa MK3S+', size: [250, 210], shape: 'rect', texture: 'textured_pei', warning: 'PEI POWDER COATED' },
            { id: 'prusa_xl', brand: 'PRUSA RESEARCH', name: 'Original Prusa XL', size: [360, 360], shape: 'rect', texture: 'satin_steel', warning: 'MODULAR MULTI-HEAD BED' },
            { id: 'prusa_mini', brand: 'PRUSA RESEARCH', name: 'Original Prusa MINI+', size: [180, 180], shape: 'rect', texture: 'smooth_pei', warning: 'COMPACT MAGNETIC BED' },

            // Voron Design Submodels
            { id: 'voron_v24_300', brand: 'VORON DESIGN', name: 'Voron 2.4 / Trident (300mm)', size: [300, 300], shape: 'rect', texture: 'carbon_fiber', warning: 'MIC-6 CAST ALUMINUM' },
            { id: 'voron_v24_350', brand: 'VORON DESIGN', name: 'Voron 2.4 (350mm)', size: [350, 350], shape: 'rect', texture: 'carbon_fiber', warning: 'HEAVY DUTY 350x350 BED' },
            { id: 'voron_v02', brand: 'VORON DESIGN', name: 'Voron V0.2 Pro', size: [120, 120], shape: 'rect', texture: 'carbon_fiber', warning: 'MICRO BUILD PLATE' },

            // Anycubic Submodels
            { id: 'anycubic_kobra2', brand: 'ANYCUBIC', name: 'Kobra 2 / Pro / Max', size: [220, 220], shape: 'rect', texture: 'textured_pei', warning: 'PEI MAGNETIC SHEET' },
            { id: 'anycubic_kobra3', brand: 'ANYCUBIC', name: 'Kobra 3 Combo', size: [250, 250], shape: 'rect', texture: 'textured_pei', warning: 'MULTI-COLOR PRINT BED' },
            { id: 'anycubic_vyper', brand: 'ANYCUBIC', name: 'Anycubic Vyper', size: [245, 245], shape: 'rect', texture: 'smooth_pei', warning: 'SPRING STEEL SHEET' },

            // Elegoo Submodels
            { id: 'elegoo_neptune4', brand: 'ELEGOO', name: 'Neptune 4 / 4 Pro', size: [225, 225], shape: 'rect', texture: 'textured_pei', warning: 'PEI MAGNETIC PLATFORM' },
            { id: 'elegoo_neptune4max', brand: 'ELEGOO', name: 'Neptune 4 Max', size: [420, 420], shape: 'rect', texture: 'textured_pei', warning: '420x420 GIANT FORMAT' },
            { id: 'elegoo_neptune4plus', brand: 'ELEGOO', name: 'Neptune 4 Plus', size: [320, 320], shape: 'rect', texture: 'textured_pei', warning: '320x320 MID-LARGE FORMAT' },

            // QIDI Tech Submodels
            { id: 'qidi_max3', brand: 'QIDI TECH', name: 'QIDI X-Max 3 / Q1 Pro', size: [325, 325], shape: 'rect', texture: 'textured_pei', warning: 'HIGH TEMP CHAMBER PEI' },
            { id: 'qidi_plus3', brand: 'QIDI TECH', name: 'QIDI X-Plus 3', size: [280, 280], shape: 'rect', texture: 'textured_pei', warning: 'ENGINEERING GRADE BED' },

            // Snapmaker Submodels
            { id: 'snapmaker_u1', brand: 'SNAPMAKER', name: 'Snapmaker U1 / Artisan', size: [400, 400], shape: 'rect', texture: 'textured_pei', warning: 'DUAL-ZONE QUICK SWAP' },
            { id: 'snapmaker_20', brand: 'SNAPMAKER', name: 'Snapmaker 2.0 A250', size: [230, 250], shape: 'rect', texture: 'smooth_pei', warning: 'MODULAR ALUMINUM BED' },

            // Sovol Submodels
            { id: 'sovol_sv06', brand: 'SOVOL', name: 'Sovol SV06 / SV06 Plus', size: [220, 220], shape: 'rect', texture: 'textured_pei', warning: 'PEI SPRING STEEL' },
            { id: 'sovol_sv07plus', brand: 'SOVOL', name: 'Sovol SV07 Plus', size: [300, 300], shape: 'rect', texture: 'textured_pei', warning: 'HIGH SPEED PEI BED' },

            // FLSUN Submodels
            { id: 'flsun_v400', brand: 'FLSUN', name: 'FLSUN V400 (Circular)', size: [300, 300], shape: 'round', texture: 'textured_pei', warning: 'DELTA HIGH SPEED' },
            { id: 'flsun_t1', brand: 'FLSUN', name: 'FLSUN T1 High Speed', size: [260, 260], shape: 'round', texture: 'textured_pei', warning: 'CIRCULAR DELTA BED' }
        ];

        let activePrinter = PRINTER_DATABASE[0];
        let userAnnotations = [];
        let selectedSpotType = 'high';
        let bedShape = 'rect';
        let currentPlateTextureType = 'textured_pei';
        let customBedTexture = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 3000);
        camera.position.set(0, -380, 320);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(150, -200, 300);
        scene.add(dirLight);

        let buildPlateGroup = new THREE.Group();
        scene.add(buildPlateGroup);
        let meshSurfaceMesh = null;

        function generateRealisticPlateTexture(printer, plateStyle) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');

            if (plateStyle === 'textured_pei') {
                ctx.fillStyle = '#18181b';
                ctx.fillRect(0, 0, 2048, 2048);
                for (let i = 0; i < 200000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(217, 119, 6, 0.12)' : 'rgba(255, 255, 255, 0.03)';
                    ctx.fillRect(Math.random() * 2048, Math.random() * 2048, 2, 2);
                }
            } else if (plateStyle === 'smooth_pei') {
                ctx.fillStyle = '#d97706';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'glass') {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'satin_steel') {
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, 2048, 2048);
            } else if (plateStyle === 'carbon_fiber') {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 2048, 2048);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
                for (let x = 0; x < 2048; x += 32) {
                    for (let y = 0; y < 2048; y += 32) {
                        if ((x + y) % 64 === 0) ctx.fillRect(x, y, 32, 32);
                    }
                }
            }

            // Grid & Ruler Borders
            if (document.getElementById('toggle-grid').checked) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 3;
                const step = 2048 / 10;
                for (let x = step; x < 2048; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 2048); ctx.stroke(); }
                for (let y = step; y < 2048; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2048, y); ctx.stroke(); }
            }

            // Brand Typography & Warning
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.font = 'bold 72px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(printer.brand, 1024, 1850);

            ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = 'rgba(245, 158, 11, 0.9)';
            ctx.fillText(printer.warning, 1024, 1930);

            // Render User Annotations (High, Low, Scratches, Oily)
            userAnnotations.forEach(ann => {
                const cx = (ann.x + printer.size[0]/2) / printer.size[0] * 2048;
                const cy = (printer.size[1]/2 - ann.y) / printer.size[1] * 2048;
                
                if (ann.type === 'scratch') {
                    ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(cx - 30, cy - 15);
                    ctx.lineTo(cx + 30, cy + 15);
                    ctx.stroke();
                } else {
                    const r = (25 / printer.size[0]) * 2048;
                    ctx.fillStyle = ann.type === 'high' ? 'rgba(239, 68, 68, 0.7)' : ann.type === 'low' ? 'rgba(59, 130, 246, 0.7)' : 'rgba(234, 179, 8, 0.7)';
                    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                }
            });

            return new THREE.CanvasTexture(canvas);
        }

        function rebuildBuildPlate() {
            while (buildPlateGroup.children.length > 0) buildPlateGroup.remove(buildPlateGroup.children[0]);

            const w = parseInt(document.getElementById('bed-width').value) || 256;
            const h = parseInt(document.getElementById('bed-length').value) || 256;

            let plateGeo = bedShape === 'round' ? new THREE.CylinderGeometry(w/2, w/2, 3.5, 64) : new THREE.BoxGeometry(w, h, 3.5);
            if (bedShape === 'round') plateGeo.rotateX(Math.PI / 2);

            let plateMat;
            if (customBedTexture) {
                plateMat = new THREE.MeshStandardMaterial({ map: customBedTexture, roughness: 0.4 });
            } else {
                const texture = generateRealisticPlateTexture(activePrinter, currentPlateTextureType);
                plateMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5, metalness: 0.2 });
            }

            const plateMesh = new THREE.Mesh(plateGeo, plateMat);
            plateMesh.position.z = -1.75;
            buildPlateGroup.add(plateMesh);

            createBedMeshSurface(w, h);
        }

        function createBedMeshSurface(w, h) {
            if (meshSurfaceMesh) buildPlateGroup.remove(meshSurfaceMesh);
            const surfGeo = new THREE.PlaneGeometry(w, h, 20, 20);
            const pos = surfGeo.attributes.position;
            const colors = [];

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), y = pos.getY(i);
                let z = Math.sin(x / 40) * Math.cos(y / 40) * 0.15;
                
                userAnnotations.forEach(ann => {
                    const dist = Math.hypot(x - ann.x, y - ann.y);
                    if (dist < 35) {
                        if (ann.type === 'high') z += 0.25 * (1 - dist/35);
                        if (ann.type === 'low') z -= 0.25 * (1 - dist/35);
                        if (ann.type === 'scratch') z -= 0.15 * (1 - dist/35);
                        if (ann.type === 'oil') z += 0.10 * (1 - dist/35);
                    }
                });

                pos.setZ(i, z * 25);
                const norm = Math.max(0, Math.min(1, (z + 0.2) / 0.4));
                const color = new THREE.Color().setHSL((1 - norm) * 0.65, 1.0, 0.5);
                colors.push(color.r, color.g, color.b);
            }
            surfGeo.computeVertexNormals();
            surfGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const showSafeZones = document.getElementById('toggle-safe').checked;
            meshSurfaceMesh = new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({ 
                vertexColors: true, 
                transparent: true, 
                opacity: showSafeZones ? 0.65 : 0.0, 
                side: THREE.DoubleSide 
            }));
            meshSurfaceMesh.position.z = 1;
            buildPlateGroup.add(meshSurfaceMesh);
        }

        function initUI() {
            const printerSel = document.getElementById('printer-select');
            printerSel.innerHTML = '';
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.innerText = "— Choose your printer —";
            printerSel.appendChild(defaultOpt);

            PRINTER_DATABASE.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = `${p.brand} - ${p.name} (${p.size[0]}×${p.size[1]}mm)`;
                printerSel.appendChild(opt);
            });

            printerSel.onchange = (e) => {
                const found = PRINTER_DATABASE.find(item => item.id === e.target.value);
                if (found) {
                    activePrinter = found;
                    document.getElementById('bed-width').value = found.size[0];
                    document.getElementById('bed-length').value = found.size[1];
                    bedShape = found.shape;
                    currentPlateTextureType = found.texture;
                    document.getElementById('plate-texture-select').value = found.texture;
                    updateShapeButtons();
                    userAnnotations = [];
                    customBedTexture = null;
                    rebuildBuildPlate();
                }
            };

            document.getElementById('plate-texture-select').onchange = (e) => {
                currentPlateTextureType = e.target.value;
                customBedTexture = null;
                rebuildBuildPlate();
            };

            document.getElementById('bed-width').oninput = rebuildBuildPlate;
            document.getElementById('bed-length').oninput = rebuildBuildPlate;

            document.getElementById('shape-rect').onclick = () => { bedShape = 'rect'; updateShapeButtons(); rebuildBuildPlate(); };
            document.getElementById('shape-round').onclick = () => { bedShape = 'round'; updateShapeButtons(); rebuildBuildPlate(); };

            document.getElementById('toggle-grid').onchange = rebuildBuildPlate;
            document.getElementById('toggle-safe').onchange = rebuildBuildPlate;

            // Spot painting tool selection
            document.querySelectorAll('.spot-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.spot-btn').forEach(b => b.classList.remove('border-brandorange', 'bg-brandorange/10', 'text-brandorange'));
                    document.querySelectorAll('.spot-btn').forEach(b => b.classList.add('border-slate-700', 'bg-darkcard', 'text-slate-300'));
                    btn.classList.remove('border-slate-700', 'bg-darkcard', 'text-slate-300');
                    btn.classList.add('border-brandorange', 'bg-brandorange/10', 'text-brandorange');
                    selectedSpotType = btn.dataset.spot;
                };
            });

            // Bed Image Upload Handler
            document.getElementById('btn-upload-trigger').onclick = () => document.getElementById('bed-image-input').click();
            document.getElementById('bed-image-input').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        new THREE.TextureLoader().load(event.target.result, (tex) => {
                            customBedTexture = tex;
                            rebuildBuildPlate();
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            document.getElementById('btn-rendered-plate').onclick = () => {
                customBedTexture = null;
                rebuildBuildPlate();
            };

            // Dark/Light Theme Toggle
            let isDark = true;
            document.getElementById('btn-theme-toggle').onclick = () => {
                isDark = !isDark;
                document.documentElement.classList.toggle('dark', isDark);
                document.documentElement.classList.toggle('light', !isDark);
                scene.background = new THREE.Color(isDark ? 0x0b0f19 : 0xf1f5f9);
            };

            lucide.createIcons();
        }

        function updateShapeButtons() {
            const rectBtn = document.getElementById('shape-rect');
            const roundBtn = document.getElementById('shape-round');
            if (bedShape === 'rect') {
                rectBtn.className = "py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all";
                roundBtn.className = "py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            } else {
                roundBtn.className = "py-2 rounded-lg text-xs font-bold bg-brandorange text-white shadow-md transition-all";
                rectBtn.className = "py-2 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all";
            }
        }

        // Raycast surface clicking to mark spots, dips, scratches, or erase
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        container.addEventListener('pointerdown', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(buildPlateGroup.children);
            if (intersects.length > 0) {
                const pt = intersects[0].point;
                if (selectedSpotType === 'erase') {
                    userAnnotations = userAnnotations.filter(a => Math.hypot(a.x - pt.x, a.y - pt.y) > 25);
                } else {
                    userAnnotations.push({ x: pt.x, y: pt.y, type: selectedSpotType });
                }
                rebuildBuildPlate();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        initUI();
        rebuildBuildPlate();
        animate();
    </script>
</body>
</html>
